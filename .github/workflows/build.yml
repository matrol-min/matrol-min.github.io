name: Build & deploy CV (site + PDF)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      # cv-data/*.yml -> data/cv.json (counts auto-computed), then print the page to
      # assets/cv.pdf with the runner's Chrome. Runs on every push, so the PDF on the
      # site always matches the YAML data.
      - name: Build data and PDF
        run: scripts/make_pdf.sh

      # Persist the papers/patents update dates (cv-data/updated.json + README top line).
      # GITHUB_TOKEN pushes don't retrigger workflows, so no loop.
      - name: Commit update dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv-data/updated.json README.md
          git diff --cached --quiet || (git commit -m "Update papers/patents update dates [skip ci]" && git push)

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
