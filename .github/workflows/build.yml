name: Build & deploy CV (site + PDF)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      # cv-data/*.yml -> data/cv.json (counts auto-computed), then print the page to
      # assets/cv.pdf with the runner's Chrome. Runs on every push, so the PDF on the
      # site always matches the YAML data.
      - name: Build data and PDF
        run: scripts/make_pdf.sh

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
