    sub_title: 수석 엔지니어 (Principal Engineer, CL4)
    caption: 2023. 3−현재
    description: '- 마이크로LED 대면적 접속 소재 및 공정 개발 주도 — R&D ~ 양산 이관 전 단계 담당

      - 마이크로LED 용 대면적 접속 소재/공정 기술 개발: ACF (Anisotropic Conductive Film) 접속 공법 안정화 (초기 픽셀 불량율 35 ppm, 신뢰성 불량율 2.5 → 0 ppm 달성)

      - 마이크로LED 픽셀 수리 공정 개발: 수리 성공률 97.0% → 99.3% 달성 및 양산 승인

      - 미세 칩 접속 공법 개발: 15×30 µm 마이크로LED 대응 접속재 및 수리 기술 개발

      - FIB, SEM, EDS, 전기적 특성 분석 활용 픽셀 수준 불량 원인 규명 (Failure/Root-cause Analysis)

      - 베트남 양산 공정 셋업 현장 지원 및 이관 안정화

      '
