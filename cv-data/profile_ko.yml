  content: '- Materials science background

    - Organic electronics background

    - Electrohydrodynamic nanowire printing technique

    - Micro- & Nano-scale lithography

    - Electronic devices fabrication & characterization (Transistors, Circuits)

    - Micro LED Display fabrication (Large-area bonding, Defect repair) & failure analysis

